<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whisker Line: LeCheddar's Revenge</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    /* Sized to fill the viewport so Phaser's FIT scale mode has a full-screen
       box to fit the game canvas into (rather than shrinking to the size of
       an unsized wrapper div). */
    #game-container {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      image-rendering: pixelated;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Vendored locally so the game runs with no build step / no npm install. -->
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
